{% extends 'base.html' %}

{% block content %}

<div class="container-fluid mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-pencil-square text-warning"></i> Editar Categoría
        </h2>
        <a href="{% url 'categorias:lista_categorias' %}" class="btn btn-secondary d-flex align-items-center gap-2">
            <i class="bi bi-arrow-left"></i>
            Volver
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-4">

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="id_nombre" class="form-label">Nombre</label>
                    {{ form.nombre }}
                    {% if form.nombre.errors %}
                        <div class="text-danger small mt-1">{{ form.nombre.errors|striptags }}</div>
                    {% endif %}
                </div>

                <div class="mb-4">
                    <label for="id_descripcion" class="form-label">Descripción</label>
                    {{ form.descripcion }}
                </div>

                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-circle me-1"></i>
                    Actualizar
                </button>
                <a href="{% url 'categorias:lista_categorias' %}" class="btn btn-outline-secondary">
                    Cancelar
                </a>
            </form>

        </div>
    </div>

</div>

{% endblock %}
