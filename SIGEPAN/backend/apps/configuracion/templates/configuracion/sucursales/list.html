{% extends "base.html" %}

{% load ayuda_tags %}

{% block content %}

{% boton_ayuda "Configuración" "sucursales" %}

<div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Sucursales</h2>

    <a href="{% url 'configuracion:sucursal_create' %}" class="btn btn-primary">
        Nueva Sucursal
    </a>
</div>

<div class="card shadow-sm mb-3 border-0">
    <div class="card-body">
        <div class="input-group">
            <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-search"></i></span>
            <input type="text" id="buscarSucursales" class="form-control border-start-0 ps-0 shadow-none" placeholder="Buscar...">
        </div>
    </div>
</div>

<div class="card shadow-sm border-0">
    <div class="card-body p-0">
        <div id="tablaSucursales" class="w-100"></div>
    </div>
</div>

{{ sucursales_json|json_script:"sucursales-data" }}

{% endblock %}

{% block js %}

<script>
document.addEventListener("DOMContentLoaded", function () {

    const dataElement = document.getElementById("sucursales-data");
    const sucursales = dataElement ? JSON.parse(dataElement.textContent) : [];

    SIGEPAN.table.create({

        selector: "#tablaSucursales",

        search: "#buscarSucursales",

        data: sucursales,

        placeholder: "No hay sucursales registradas.",

        columns: [

            {
                title: "Nombre",
                field: "nombre",
                headerHozAlign: "left"
            },

            {
                title: "Dirección",
                field: "direccion"
            },

            {
                title: "Teléfono",
                field: "telefono"
            },

            {
                title: "Encargado",
                field: "encargado"
            },

            {
                title: "Estado",
                field: "estado",
                hozAlign: "center",

                formatter(cell){

                    return cell.getValue()
                        ? '<span class="badge bg-success bg-opacity-10 text-success px-2 py-1">Activa</span>'
                        : '<span class="badge bg-danger bg-opacity-10 text-danger px-2 py-1">Inactiva</span>';

                }

            },

            {
                title: "Acciones",
                hozAlign: "center",

                formatter(cell) {

                    const data = cell.getRow().getData();

                    return `
                        <div class="d-flex justify-content-center">

                            <a
                                href="${data.editar}"
                                class="btn btn-outline-info btn-sm"
                            >
                                Editar
                            </a>

                        </div>
                    `;

                }

            }

        ]

    });

});
</script>

{% endblock %}
