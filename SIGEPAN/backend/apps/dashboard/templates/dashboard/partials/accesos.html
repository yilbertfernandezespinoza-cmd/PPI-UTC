<div class="card mb-4">

    <div class="card-header">
        <strong>Accesos rápidos</strong>
    </div>

    <div class="card-body">

        <div class="row g-3">

            {% for acceso in accesos_rapidos %}

                <div class="col-lg-3 col-md-6">

                    <a href="{{ acceso.url }}"
                       class="btn btn-outline-{{ acceso.color }} w-100 py-4 h-100">

                        {% if acceso.icono == "svg-caja-registradora" %}
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="d-block mx-auto mb-3" aria-hidden="true">
                                <rect x="13" y="2" width="8" height="5" rx="1"></rect>
                                <line x1="17" y1="7" x2="17" y2="10"></line>
                                <rect x="8" y="4" width="3" height="7" rx="1"></rect>
                                <path d="M6 11 L18 11 L21 16 L3 16 Z"></path>
                                <rect x="3" y="16" width="18" height="6" rx="1.2"></rect>
                                <line x1="9" y1="19" x2="15" y2="19" stroke-width="2.2"></line>
                            </svg>
                        {% elif acceso.icono == "svg-canasta-productos" %}
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" class="d-block mx-auto mb-3" aria-hidden="true">
                                <rect x="7.5" y="1.5" width="3" height="9.5" rx="1.3"></rect>
                                <rect x="13" y="0.5" width="3" height="10.5" rx="1.3"></rect>
                                <path d="M5 10 V7.5 Q5 5 7.5 5"></path>
                                <path d="M19 10 V7.5 Q19 5 16.5 5"></path>
                                <path d="M3 10 L21 10 L18.5 21 L5.5 21 Z"></path>
                                <line x1="9" y1="10" x2="8.3" y2="21"></line>
                                <line x1="15" y1="10" x2="15.7" y2="21"></line>
                            </svg>
                        {% else %}
                            <i class="bi {{ acceso.icono }} display-6 d-block mb-3"></i>
                        {% endif %}

                        <span class="fw-semibold">
                            {{ acceso.titulo }}
                        </span>

                    </a>

                </div>

            {% endfor %}

        </div>

    </div>

</div>
