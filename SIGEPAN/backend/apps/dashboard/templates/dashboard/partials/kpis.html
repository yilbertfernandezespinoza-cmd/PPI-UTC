<div class="row mb-4">

    {% for kpi in kpis %}

        <div class="col-lg-3 col-md-6 mb-3">

            <div class="card border-{{ kpi.color }} shadow-sm">

                <div class="card-body">

                    <div class="d-flex justify-content-between align-items-center">

                        <div>

                            <small class="text-muted">

                                {{ kpi.titulo }}

                            </small>

                            <h3 class="mb-0">

                                {{ kpi.valor }}

                            </h3>

                        </div>

                        <i class="{{ kpi.icono }} fs-1 text-{{ kpi.color }}"></i>

                    </div>

                </div>

            </div>

        </div>

    {% endfor %}

</div>
