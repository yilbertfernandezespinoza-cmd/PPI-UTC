{% extends "base.html" %}

{% block content %}

<h2>Cargos</h2>

<a href="{% url 'empleados:cargo_create' %}" class="btn btn-primary mb-3">
    Nuevo Cargo
</a>

<div id="tablaCargos"></div>

{% endblock %}

{% block js %}

<script>

const cargos = [

{% for cargo in cargos %}

{
    id: {{ cargo.id_cargo }},
    nombre: "{{ cargo.nombre|escapejs }}",
    descripcion: "{{ cargo.descripcion|default:'-'|escapejs }}",
    estado: {{ cargo.estado|yesno:"true,false" }},
    editar: "{% url 'empleados:cargo_update' cargo.id_cargo %}"
}{% if not forloop.last %},{% endif %}

{% endfor %}

];

console.log("Cargos:", cargos);

const columns = [

    {
        title: "ID",
        field: "id",
        hozAlign: "center",
        width: 90
    },

    {
        title: "Nombre",
        field: "nombre"
    },

    {
        title: "Descripción",
        field: "descripcion"
    },

    {
        title: "Estado",
        field: "estado",
        hozAlign: "center",

        formatter(cell) {

            return cell.getValue()
                ? '<span class="badge bg-success">Activo</span>'
                : '<span class="badge bg-danger">Inactivo</span>';

        }

    },

    {
        title: "Acciones",
        hozAlign: "center",

        formatter(cell) {

            const data = cell.getRow().getData();

            return `
                <div class="d-flex justify-content-center">

                    <a
                        href="${data.editar}"
                        class="btn btn-warning btn-sm"
                    >
                        Editar
                    </a>

                </div>
            `;

        }

    }

];

SIGEPAN.table.create({

    selector: "#tablaCargos",

    data: cargos,

    columns

});

</script>

{% endblock %}
