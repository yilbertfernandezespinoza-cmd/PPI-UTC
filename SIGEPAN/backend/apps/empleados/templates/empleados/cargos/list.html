{% extends "base.html" %}

{% load ayuda_tags %}

{% block content %}

{% boton_ayuda "Configuración" "cargos" %}

<div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Cargos</h2>
    <a href="{% url 'empleados:cargo_create' %}" class="btn btn-primary">
        Nuevo Cargo
    </a>
</div>

<!-- Barra de búsqueda -->
<div class="card shadow-sm mb-3 border-0">
    <div class="card-body">
        <div class="input-group">
            <span class="input-group-text bg-white border-end-0 text-muted">
                <i class="bi bi-search"></i>
            </span>
            <input type="text" id="buscarCargos" class="form-control border-start-0 ps-0 shadow-none" placeholder="Buscar por nombre o descripción...">
        </div>
    </div>
</div>

<!-- Tabla con Tabulator -->
<div class="card shadow-sm border-0">
    <div class="card-body p-0">
        <div id="tablaCargos" class="w-100"></div>
    </div>
</div>

<!-- Inyectamos los datos de forma segura mediante JSON -->
{{ cargos_json|json_script:"cargos-data" }}

{% endblock %}

{% block js %}
<script>
document.addEventListener("DOMContentLoaded", function () {
    const dataElement = document.getElementById("cargos-data");
    const cargos = dataElement ? JSON.parse(dataElement.textContent) : [];

    SIGEPAN.table.create({
        selector: "#tablaCargos",
        search: "#buscarCargos",
        data: cargos,
        placeholder: "No hay cargos registrados.",
        columns: [
            { title: "Nombre", field: "nombre" },
            { title: "Descripción", field: "descripcion" },
            {
                title: "Estado",
                field: "estado",
                hozAlign: "center",
                formatter(cell) {
                    return cell.getValue()
                        ? '<span class="badge bg-success bg-opacity-10 text-success px-2 py-1">Activo</span>'
                        : '<span class="badge bg-danger bg-opacity-10 text-danger px-2 py-1">Inactivo</span>';
                }
            },
            {
                title: "Acciones",
                hozAlign: "center",
                formatter(cell) {
                    const data = cell.getRow().getData();
                    return `<a href="${data.editar}" class="btn btn-outline-warning btn-sm"><i class="bi bi-pencil"></i> Editar</a>`;
                }
            }
        ]
    });
});
</script>
{% endblock %}
