{% extends "base.html" %}

{% load ayuda_tags %}

{% block content %}

{% boton_ayuda "Configuración" "empleados" %}

<h2>Empleados</h2>

<a href="{% url 'empleados:empleado_create' %}" class="btn btn-primary mb-3">
    Nuevo Empleado
</a>

<div id="tablaEmpleados"></div>

{% endblock %}

{% block js %}

<script>

const empleados = [

{% for empleado in empleados %}

{
    id: {{ empleado.id_empleado }},
    identificacion: "{{ empleado.identificacion|escapejs }}",
    nombre_completo: "{{ empleado.nombre|escapejs }} {{ empleado.apellido1|escapejs }} {{ empleado.apellido2|default:''|escapejs }}",
    cargo: "{{ empleado.id_cargo.nombre|escapejs }}",
    telefono: "{{ empleado.telefono|default:'-'|escapejs }}",
    correo: "{{ empleado.correo|default:'-'|escapejs }}",
    estado: {{ empleado.estado|yesno:"true,false" }},
    editar: "{% url 'empleados:empleado_update' empleado.id_empleado %}"
}{% if not forloop.last %},{% endif %}

{% endfor %}

];

console.log("Empleados:", empleados);

const columns = [

    {
        title: "ID",
        field: "id",
        hozAlign: "center",
        width: 90
    },

    {
        title: "Identificación",
        field: "identificacion"
    },

    {
        title: "Nombre Completo",
        field: "nombre_completo"
    },

    {
        title: "Cargo",
        field: "cargo"
    },

    {
        title: "Teléfono",
        field: "telefono"
    },

    {
        title: "Correo",
        field: "correo"
    },

    {
        title: "Estado",
        field: "estado",
        hozAlign: "center",

        formatter(cell) {

            return cell.getValue()
                ? '<span class="badge bg-success">Activo</span>'
                : '<span class="badge bg-danger">Inactivo</span>';

        }

    },

    {
        title: "Acciones",
        hozAlign: "center",

        formatter(cell) {

            const data = cell.getRow().getData();

            return `
                <div class="d-flex justify-content-center">

                    <a
                        href="${data.editar}"
                        class="btn btn-warning btn-sm"
                    >
                        Editar
                    </a>

                </div>
            `;

        }

    }

];

SIGEPAN.table.create({

    selector: "#tablaEmpleados",

    data: empleados,

    columns

});

</script>

{% endblock %}
