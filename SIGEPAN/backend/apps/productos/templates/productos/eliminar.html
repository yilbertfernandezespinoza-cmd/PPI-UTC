{% extends 'base.html' %}
{% block content %}
<section class="content">
  <div class="container-fluid">
    <div class="card card-danger">
      <div class="card-header">
        <h3 class="card-title">Eliminar Producto</h3>
        <a href="{% url 'productos:lista_productos' %}" class="btn btn-secondary float-right">Volver</a>
      </div>
      <div class="card-body">
        <p>¿Estás seguro que deseas eliminar el producto <strong>{{ producto.nombre }}</strong>?</p>
        <form method="post">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">Sí, eliminar</button>
          <a href="{% url 'productos:lista_productos' %}" class="btn btn-secondary">Cancelar</a>
        </form>
      </div>
    </div>
  </div>
</section>
{% endblock %}
