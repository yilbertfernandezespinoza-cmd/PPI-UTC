{% extends 'base.html' %}

{% load ayuda_tags %}

{% block content %}

{% boton_ayuda "Productos" "productos" %}

<div class="container-fluid mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-0">
                <i class="bi bi-box-seam text-warning"></i> Gestión de Productos
            </h2>
            <small class="text-muted">
                Administra el catálogo de productos del sistema.
            </small>
        </div>
        <a href="{% url 'productos:nuevo_producto' %}" class="btn btn-primary d-flex align-items-center gap-2 shadow-sm">
            <i class="bi bi-plus-circle fs-5"></i>
            Nuevo Producto
        </a>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <input type="text" id="buscarProductos" class="form-control" placeholder="Buscar por código o nombre...">
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <div id="tablaProductos"></div>
        </div>
    </div>

</div>

{{ productos_json|json_script:"productos-data" }}

{% endblock %}

{% block js %}
<script>
document.addEventListener("DOMContentLoaded", function () {

    const productosElement = document.getElementById("productos-data");
    const productos = productosElement ? JSON.parse(productosElement.textContent) : [];

    SIGEPAN.table.create({
        selector: "#tablaProductos",
        search: "#buscarProductos",
        data: productos,
        columns: [
            { title: "Código", field: "codigo" },
            { title: "Nombre", field: "nombre" },
            { title: "Precio Compra (₡)", field: "precio_compra" },
            { title: "Precio Venta (₡)", field: "precio_venta" },
            { title: "Unidad", field: "unidad_medida" },
            { title: "Categoría", field: "categoria" },
            {
                title: "Estado",
                field: "estado",
                formatter(cell) {
                    return cell.getValue()
                        ? '<span class="badge bg-success">Activo</span>'
                        : '<span class="badge bg-danger">Inactivo</span>';
                }
            },
            {
                title: "Acciones",
                hozAlign: "center",
                formatter(cell) {
                    const data = cell.getRow().getData();
                    return `
                        <div class="d-flex justify-content-center gap-2">
                            <a href="${data.editar}" class="btn btn-outline-warning btn-sm" title="Editar">
                                <i class="bi bi-pencil-square"></i>
                            </a>
                            <a href="${data.eliminar}" class="btn btn-outline-danger btn-sm" title="Deshabilitar">
                                <i class="bi bi-x-circle"></i>
                            </a>
                        </div>
                    `;
                }
            }
        ]
    });
});
</script>
{% endblock %}
