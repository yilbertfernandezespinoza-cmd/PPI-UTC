{% extends 'base.html' %}
{% block content %}

<section class="content">
    <div class="container-fluid">
        <div class="card card-outline card-primary">
            <div class="card-header">
                <h3 class="card-title font-weight-bold pt-1">
                    <i class="fas fa-plus-circle mr-2"></i> Nuevo Producto
                </h3>
            </div>

            <div class="card-body">
                <!-- Importante: enctype añadido por si manejas imágenes -->
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}

                    <div class="row">
                        <!-- Iteramos sobre los campos excluyendo 'estado' para ordenarlos de forma limpia -->
                        {% for field in form %}
                            {% if field.name != 'estado' %}
                                <div class="col-md-6">
                                    <div class="form-group">
                                        {{ field.label_tag }}
                                        {{ field }}

                                        {% if field.errors %}
                                            <div class="text-danger small mt-1">
                                                {{ field.errors }}
                                            </div>
                                        {% endif %}
                                    </div>
                                </div>
                            {% endif %}
                        {% endfor %}
                    </div>

                    <hr class="my-3">

                    <!-- Sección del Estado (mantiene tu lógica interactiva intacta) -->
                    <div class="form-group">
                        <label for="id_estado">
                            <strong>Estado del Producto:</strong>
                        </label>
                        <div class="form-check">
                            <input
                                type="checkbox"
                                class="form-check-input"
                                id="id_estado"
                                name="estado"
                                {% if form.estado.value or form.estado.value is None %}checked{% endif %}
                            >
                            <label class="form-check-label" for="id_estado">
                                <span id="estado_label" class="font-weight-bold text-success">
                                    Activo
                                </span>
                            </label>
                        </div>
                    </div>

                    <div class="form-group mt-4">
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="fas fa-save mr-1"></i> Guardar Producto
                        </button>
                        <a href="{% url 'productos:lista_productos' %}" class="btn btn-danger ml-2 px-3">
                            <i class="fas fa-arrow-left mr-1"></i> Cancelar y Volver
                        </a>
                    </div>

                </form>
            </div>
        </div>
    </div>
</section>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const checkbox = document.getElementById("id_estado");
    const label = document.getElementById("estado_label");

    if (checkbox && label) {
        function actualizarEstado() {
            if (checkbox.checked) {
                label.textContent = "Activo";
                label.classList.remove("text-danger");
                label.classList.add("text-success");
            } else {
                label.textContent = "Inactivo";
                label.classList.remove("text-success");
                label.classList.add("text-danger");
            }
        }

        actualizarEstado();
        checkbox.addEventListener("change", actualizarEstado);
    }
});
</script>

{% endblock %}
