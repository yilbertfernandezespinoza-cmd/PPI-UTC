{% extends "base.html" %}

{% load ayuda_tags %}

{% block content %}

{% boton_ayuda "Reportes" "reporte_inventario" %}

<h2>Reporte de Inventario</h2>

<hr>

<div class="card">

    <div class="card-body">

        <form method="get" class="row g-3 mb-4">

            <div class="col-md-4">
                <label class="form-label">Sucursal</label>
                <select name="sucursal" class="form-select">
                    <option value="">Todas</option>
                    {% for s in sucursales %}
                        <option value="{{ s.id_sucursal }}" {% if sucursal_id == s.id_sucursal|stringformat:"s" %}selected{% endif %}>
                            {{ s.nombre }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-4 d-flex align-items-end">
                <div class="form-check">
                    <input type="checkbox" name="bajo_minimo" value="1" class="form-check-input" id="bajoMinimo" {% if solo_bajo_minimo %}checked{% endif %}>
                    <label class="form-check-label" for="bajoMinimo">Solo productos bajo el mínimo</label>
                </div>
            </div>

            <div class="col-md-4 d-flex align-items-end">
                <button type="submit" class="btn btn-primary w-100">Consultar</button>
            </div>

        </form>

        <div class="mb-3">
            <a href="?sucursal={{ sucursal_id }}&formato=pdf" class="btn btn-outline-danger btn-sm" target="_blank">
                <i class="bi bi-file-earmark-pdf"></i> Exportar PDF
            </a>
            <a href="?sucursal={{ sucursal_id }}&formato=excel" class="btn btn-outline-success btn-sm">
                <i class="bi bi-file-earmark-excel"></i> Exportar Excel
            </a>
            <a href="?sucursal={{ sucursal_id }}&formato=sheets" class="btn btn-outline-primary btn-sm" target="_blank">
                <i class="bi bi-google"></i> Exportar a Google Sheets
            </a>
        </div>

        <div class="card shadow-sm mb-3 border-0">
            <div class="card-body">
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-search"></i></span>
                    <input type="text" id="buscarInventario" class="form-control border-start-0 ps-0 shadow-none" placeholder="Buscar...">
                </div>
            </div>
        </div>
        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div id="tablaInventario" class="w-100"></div>
            </div>
        </div>

    </div>

</div>

{{ inventario_json|json_script:"inventario-data" }}

{% endblock %}

{% block js %}
<script>
document.addEventListener("DOMContentLoaded", function () {
    const inventarioElement = document.getElementById("inventario-data");
    const inventario = inventarioElement ? JSON.parse(inventarioElement.textContent) : [];

    SIGEPAN.table.create({
        selector: "#tablaInventario",
        search: "#buscarInventario",
        data: inventario,
        placeholder: "No hay inventario registrado.",
        rowFormatter(row){
            const data = row.getData();
            if (data.bajo_minimo) {
                row.getElement().classList.add("table-warning");
            }
        },
        columns: [
            { title: "Producto", field: "producto" },
            { title: "Sucursal", field: "sucursal" },
            { title: "Stock actual", field: "stock_actual", hozAlign: "right" },
            { title: "Stock mínimo", field: "stock_minimo", hozAlign: "right" },
            { title: "Stock máximo", field: "stock_maximo", hozAlign: "right" },
        ]
    });
});
</script>
{% endblock %}
