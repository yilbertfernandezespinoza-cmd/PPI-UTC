{% extends "base.html" %}

{% block content %}

<h2>Bitácora de Movimientos</h2>

<hr>

<div class="card">

    <div class="card-body">

        <form method="get" class="row g-3 mb-4">

            <div class="col-md-4">
                <label class="form-label">Usuario</label>
                <input
                    type="text"
                    name="usuario"
                    class="form-control"
                    value="{{ usuario }}"
                    placeholder="Buscar por usuario"
                >
            </div>

            <div class="col-md-3">
                <label class="form-label">Fecha inicio</label>
                <input type="date" name="fecha_inicio" class="form-control" value="{{ fecha_inicio }}">
            </div>

            <div class="col-md-3">
                <label class="form-label">Fecha fin</label>
                <input type="date" name="fecha_fin" class="form-control" value="{{ fecha_fin }}">
            </div>

            <div class="col-md-2 d-flex align-items-end">
                <button type="submit" class="btn btn-primary w-100">Consultar</button>
            </div>

        </form>

        {% if usuario or fecha_inicio or fecha_fin %}
            <div class="mb-3">
                <a href="{% url 'security:bitacora_movimientos' %}" class="btn btn-outline-secondary btn-sm">
                    Limpiar filtros
                </a>
            </div>
        {% endif %}

        <div id="tablaBitacora"></div>

    </div>

</div>

{% endblock %}

{% block js %}

<script>

const registros = [
    {% for registro in registros %}
    {
        usuario: "{{ registro.id_usuario.username|escapejs }}",
        modulo: "{{ registro.id_modulo.nombre|escapejs }}",
        accion: "{{ registro.tipo_accion|escapejs }}",
        descripcion: "{{ registro.descripcion|escapejs }}",
        ip: "{{ registro.ip_origen|default:'-'|escapejs }}",
        fecha: "{{ registro.fecha_hora|date:'d/m/Y H:i:s' }}"
    },
    {% endfor %}
];

document.addEventListener("DOMContentLoaded", function () {

    const tabla = SIGEPAN.table.create({
        selector: "#tablaBitacora",
        search: "#buscarBitacora",

        data: registros,

        columns: [
            { title: "Usuario", field: "usuario" },
            { title: "Módulo", field: "modulo" },
            { title: "Acción", field: "accion" },
            { title: "Descripción", field: "descripcion" },
            { title: "IP Origen", field: "ip" },
            { title: "Fecha y Hora", field: "fecha" }
        ]

    });

});

</script>

{% endblock %}
