<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Recuperar contraseña - SIGEPAN</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

<div class="container">

    <div class="row justify-content-center mt-5">

        <div class="col-md-4">

            <div class="card shadow">

                <div class="card-header text-center">

                    <h3>SIGEPAN</h3>

                    <small>Recuperar contraseña</small>

                </div>

                <div class="card-body">

                    <p class="text-muted">

                        Ingrese su usuario o correo electrónico.

                    </p>

                    {% if form.non_field_errors %}

                        <div class="alert alert-danger">

                            {{ form.non_field_errors }}

                        </div>

                    {% endif %}

                    <form method="post">

                        {% csrf_token %}

                        <div class="mb-3">

                            {{ form.identificador.label_tag }}

                            {{ form.identificador }}

                            {% for error in form.identificador.errors %}

                                <div class="text-danger">

                                    {{ error }}

                                </div>

                            {% endfor %}

                        </div>

                        <div class="d-grid gap-2">

                            <button
                                type="submit"
                                class="btn btn-primary"
                            >
                                Recuperar contraseña
                            </button>

                            <a
                                href="{% url 'security:login' %}"
                                class="btn btn-secondary"
                            >
                                Cancelar
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
