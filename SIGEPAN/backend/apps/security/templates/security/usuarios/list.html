{% extends "base.html" %}

{% load ayuda_tags %}

{% block content %}

{% boton_ayuda "Seguridad" "usuarios" %}

<!-- Contenedor con permisos y csrf limpios para el linter -->
<div id="usuario-config"
     data-puede-modificar="{{ puede_modificar|yesno:'true,false' }}"
     data-puede-eliminar="{{ puede_eliminar|yesno:'true,false' }}"
     data-csrf="{{ csrf_token }}"
     class="d-none">
</div>

<div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Usuarios</h2>

    {% if puede_crear %}
        <a
            href="{% url 'security:usuario_create' %}"
            class="btn btn-primary"
        >
            Nuevo Usuario
        </a>
    {% endif %}
</div>

<div class="card shadow-sm mb-3 border-0">
    <div class="card-body">
        <div class="input-group">
            <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-search"></i></span>
            <input type="text" id="buscarUsuarios" class="form-control border-start-0 ps-0 shadow-none" placeholder="Buscar por usuario, empleado o correo...">
        </div>
    </div>
</div>

<div class="card shadow-sm border-0">
    <div class="card-body p-0">
        <div id="tablaUsuarios" class="w-100"></div>
    </div>
</div>

{{ usuarios_json|json_script:"usuarios-data" }}

{% endblock %}

{% block js %}

<script>
document.addEventListener("DOMContentLoaded", function () {

    const configEl = document.getElementById("usuario-config");
    const csrfTokenGlobal = configEl ? configEl.dataset.csrf : "";

    const usuariosElement = document.getElementById("usuarios-data");
    const usuarios = usuariosElement ? JSON.parse(usuariosElement.textContent) : [];
    usuarios.forEach(u => { u.csrfToken = csrfTokenGlobal; });

    SIGEPAN.table.create({

        selector: "#tablaUsuarios",

        search: "#buscarUsuarios",

        data: usuarios,

        placeholder: "No hay usuarios registrados.",

        columns: [

            {
                title: "ID",
                field: "id_usuario"
            },

            {
                title: "Usuario",
                field: "username"
            },

            {
                title: "Empleado",
                field: "empleado"
            },

            {
                title: "Rol",
                field: "rol"
            },

            {
                title: "Sucursal",
                field: "sucursal"
            },

            {
                title: "Correo",
                field: "correo"
            },

            {
                title: "Estado",
                field: "estado",

                formatter(cell){
                    return cell.getValue()
                        ? '<span class="badge bg-success">Activo</span>'
                        : '<span class="badge bg-danger">Inactivo</span>';
                }
            },

            {
                title: "Acciones",
                hozAlign: "center",

                formatter(cell) {

                    const data = cell.getRow().getData();

                    return `
                        <div class="d-flex gap-1 justify-content-center">

                            <a
                                href="${data.editar_url}"
                                class="btn btn-outline-info btn-sm"
                            >
                                Editar
                            </a>

                            <button
                                class="btn btn-outline-danger btn-sm btn-deshabilitar"
                            >
                                Deshabilitar
                            </button>

                        </div>
                    `;

                },

                cellClick(e, cell) {

                    if (!e.target.classList.contains("btn-deshabilitar")) {
                        return;
                    }

                    const data = cell.getRow().getData();

                    SIGEPAN.table.postAction({

                        url: data.deshabilitar_url,

                        csrfToken: data.csrfToken,

                        message: "¿Desea deshabilitar este usuario?"

                    });

                }

            }

        ]

    });

});
</script>

{% endblock %}
