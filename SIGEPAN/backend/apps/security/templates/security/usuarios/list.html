{% extends "base.html" %}

{% block content %}

<h2>Usuarios</h2>

<div class="row mb-3">

    <div class="col-md-5">

        <input
            type="text"
            id="buscarUsuarios"
            class="form-control"
            placeholder="Buscar por usuario, empleado o correo..."
        >

    </div>

</div>

{% if puede_crear %}

    <a
        href="{% url 'security:usuario_create' %}"
        class="btn btn-primary mb-3"
    >
        Nuevo Usuario
    </a>

{% endif %}

<div id="tablaUsuarios"></div>

{% endblock %}

{% block js %}

<script>

const usuarios = [

{% for usuario in usuarios %}

{
    id: "{{ usuario.id_usuario }}",
    usuario: "{{ usuario.username|escapejs }}",
    empleado: "{{ usuario.id_empleado.nombre|escapejs }} {{ usuario.id_empleado.apellido1|escapejs }}",
    rol: "{{ usuario.id_rol.nombre|escapejs }}",
    sucursal: "{% if usuario.id_sucursal %}{{ usuario.id_sucursal.nombre|escapejs }}{% endif %}",
    correo: "{{ usuario.id_empleado.correo|default:''|escapejs }}",
    estado: {{ usuario.estado|yesno:"true,false" }},
    editar: "{% url 'security:usuario_update' usuario.id_usuario %}",

    deshabilitar: "{% url 'security:usuario_disable' usuario.id_usuario %}",
    csrfToken: "{{ csrf_token }}"
}{% if not forloop.last %},{% endif %}

{% endfor %}

];

console.log("Usuarios:", usuarios);

SIGEPAN.table.create({

    selector: "#tablaUsuarios",

    search: "#buscarUsuarios",

    data: usuarios,

    columns: [

        {
            title: "ID",
            field: "id"
        },

        {
            title: "Usuario",
            field: "usuario"
        },

        {
            title: "Empleado",
            field: "empleado"
        },

        {
            title: "Rol",
            field: "rol"
        },

        {
            title: "Sucursal",
            field: "sucursal"
        },

        {
            title: "Correo",
            field: "correo"
        },

        {
            title: "Estado",
            field: "estado",

            formatter(cell){
                return cell.getValue()
                    ? '<span class="badge bg-success">Activo</span>'
                    : '<span class="badge bg-danger">Inactivo</span>';
            }
        },

        {
            title: "Acciones",
            hozAlign: "center",

            formatter(cell) {

                const data = cell.getRow().getData();

                return `
                    <div class="d-flex gap-1 justify-content-center">

                        <a
                            href="${data.editar}"
                            class="btn btn-warning btn-sm"
                        >
                            Editar
                        </a>

                        <button
                            class="btn btn-danger btn-sm btn-deshabilitar"
                        >
                            Deshabilitar
                        </button>

                    </div>
                `;

            },

            cellClick(e, cell) {

                if (!e.target.classList.contains("btn-deshabilitar")) {
                    return;
                }

                const data = cell.getRow().getData();

                SIGEPAN.table.postAction({

                    url: data.deshabilitar,

                    csrfToken: data.csrfToken,
            
                    message: "¿Desea deshabilitar este usuario?"

                });

            }

        }

    ]

});

</script>

{% endblock %}
