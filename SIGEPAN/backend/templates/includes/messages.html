{% if messages %}

    {% for message in messages %}

        <div
            class="alert
                {% if message.tags == 'error' %}
                    alert-danger
                {% else %}
                    alert-{{ message.tags }}
                {% endif %}
                alert-dismissible fade show sigepan-alert"
            role="alert"
        >

            {{ message }}

            <button
                type="button"
                class="btn-close"
                data-bs-dismiss="alert"
                aria-label="Cerrar"
            >
            </button>

        </div>

    {% endfor %}

{% endif %}


<script>

document.addEventListener("DOMContentLoaded", function(){

    const alertas =
        document.querySelectorAll(".sigepan-alert");

    alertas.forEach(function(alerta){

        setTimeout(function(){

            alerta.classList.remove("show");

            setTimeout(function(){
                alerta.remove();
            }, 150);

        }, 5000);

    });

});

</script>
