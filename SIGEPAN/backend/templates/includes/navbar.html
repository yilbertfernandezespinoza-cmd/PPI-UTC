{% load static %}

<header class="app-header navbar navbar-expand bg-white shadow-sm">

    <div class="container-fluid">

        <ul class="navbar-nav">

            <li class="nav-item">

                <a class="nav-link"
                    data-lte-toggle="sidebar"
                    href="#"
                    role="button">

                    <i class="bi bi-list"></i>

                </a>

            </li>

        </ul>

        <a href="{% url 'dashboard:inicio' %}" class="navbar-brand d-flex align-items-center">

            <img src="{% static 'img/logos/sigepan-icon.png' %}"
                 width="38"
                 class="me-2">

            <strong>SIGEPAN</strong>

        </a>

        <ul class="navbar-nav ms-auto">

                <li class="nav-item dropdown">

                    <a class="nav-link dropdown-toggle d-flex align-items-center"
                       href="#"
                       role="button"
                       data-bs-toggle="dropdown"
                       aria-expanded="false">

                        <i class="bi bi-person-circle me-2"></i>

                        {{ usuario_sesion.username }}

                    </a>

                    <ul class="dropdown-menu dropdown-menu-end shadow">

                        <li class="px-3 py-2">

                            <strong>
                                {{ usuario_sesion.nombre_completo }}
                            </strong>

                            <br>

                            <small class="text-muted">
                                {{ usuario_sesion.rol }}
                            </small>

                        </li>

                        <li><hr class="dropdown-divider"></li>

                        <li class="px-3">

                            <small class="text-muted">
                                Empresa
                            </small>

                            <div>
                                {{ usuario_sesion.empresa }}
                            </div>

                        </li>

                        <li class="px-3 mt-2">

                            <small class="text-muted">
                                Sucursal
                            </small>

                            <div>
                                {{ usuario_sesion.sucursal }}
                            </div>

                        </li>

                        <li><hr class="dropdown-divider"></li>

                        <li>

                            <a class="dropdown-item"
                                href="{% url 'security:perfil' %}">

                                <i class="bi bi-person me-2"></i>

                                Mi perfil

                            </a>

                        </li>

                        <li>

                            <a class="dropdown-item text-danger"
                                href="{% url 'security:logout' %}">

                                <i class="bi bi-box-arrow-right me-2"></i>

                                Cerrar sesión

                            </a>

                        </li>

                    </ul>

                </li>   

        </ul>

    </div>

</header>
