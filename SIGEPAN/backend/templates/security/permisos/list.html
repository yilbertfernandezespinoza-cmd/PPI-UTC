{% extends "base.html" %}

{% block content %}
<h2>Permisos</h2>

<a href="{% url 'security:permiso_create' %}" class="btn btn-primary">
    Nuevo Permiso
</a>

<table class="table table-striped mt-3">
    <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
    </thead>

    <tbody>

    {% for permiso in permisos %}

        <tr>

            <td>{{ permiso.id_permiso }}</td>

            <td>{{ permiso.nombre }}</td>

            <td>
                {% if permiso.estado %}
                    <span class="badge bg-success">Activo</span>
                {% else %}
                    <span class="badge bg-danger">Inactivo</span>
                {% endif %}
            </td>

            <td>
                <a href="{% url 'security:permiso_update' permiso.id_permiso %}"
                   class="btn btn-warning btn-sm">
                    Editar
                </a>
            </td>

        </tr>

    {% endfor %}

    </tbody>

</table>

{% endblock %}
